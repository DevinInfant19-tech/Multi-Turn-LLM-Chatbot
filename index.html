<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy - Gemini Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="chat-app">
        <header class="header">
            <div>
                <h1>StudyBuddy</h1>
                <p>Your friendly AI learning assistant</p>
            </div>
            <button id="new-chat" class="new-chat">New Chat</button>
        </header>

        <section id="chat-box" class="chat-box" aria-live="polite">
            <div class="message bot">
                <div class="bubble">
                    Hello! I'm StudyBuddy. Ask me a question and I'll explain it in simple words.
                </div>
            </div>
        </section>

        <form id="chat-form" class="input-area">
            <input
                id="message-input"
                type="text"
                placeholder="Type your message..."
                maxlength="4000"
                autocomplete="off"
                required
            >
            <button id="send-button" type="submit">Send</button>
        </form>

        <p class="note">StudyBuddy uses Gemini AI. Do not share passwords or private information.</p>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
